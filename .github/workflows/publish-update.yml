# Oxy Updates: the GoWay app's OTA update, on every push to main that can
# change its bundle. `oxy-ship` runs `expo export` and publishes the JS bundle
# and assets to channel `production` of GoWay's application, under the
# runtime of the app's `version` (withOxyUpdates, policy `appVersion`). A native
# change bumps `version`, and `android-release.yml` builds the binary for it.
#
# No secret: GitHub trusted publishing (OxyHQ/oxy ADR 0057). The job's OIDC
# token is exchanged for a five-minute `updates:publish` token of GoWay
# only, because this repository, `refs/heads/main` and THIS file's path are
# registered as its trusted publisher (oxy's seedOxyApplicationsSpecs.ts). Keep
# the path. Pull requests never publish.

name: Publish OTA update

on:
  push:
    branches: [main]
    paths:
      - packages/frontend/**
      - packages/contracts/**
      - packages/sdk/**
      - packages/maps/**
      - package.json
      - bun.lock
      - .github/workflows/publish-update.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oxy-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_DIR: packages/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The root postinstall builds the contracts, @goway.to/sdk and
      # @goway.to/maps, which the app imports from their dist.
      - run: bun install --frozen-lockfile --minimum-release-age=0

      # The update must be exported with the env the binary was built with: the
      # eas.json `production` profile's `env` (following `extends`), exactly as
      # OxyHQ/oxy's android-release.yml exports it for the native build.
      - name: Build environment from eas.json
        run: |
          node - <<'EOF' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const eas = JSON.parse(readFileSync(join(process.env.APP_DIR, 'eas.json'), 'utf8'));
          const resolve = (name, seen = new Set()) => {
            const profile = eas.build?.[name];
            if (!profile) throw new Error(`eas.json has no build profile "${name}"`);
            if (seen.has(name)) throw new Error(`eas.json profile "${name}" extends itself`);
            seen.add(name);
            const base = profile.extends ? resolve(profile.extends, seen) : {};
            return { ...base, ...profile.env };
          };
          for (const [key, value] of Object.entries(resolve('production'))) {
            if (!/^[A-Z_][A-Z0-9_]*$/.test(key) || /[\r\n]/.test(String(value))) {
              throw new Error(`eas.json env ${key} cannot be exported`);
            }
            console.log(`${key}=${value}`);
          }
          console.log('NODE_ENV=production');
          EOF

      - name: Publish to channel production
        working-directory: ${{ env.APP_DIR }}
        env:
          # GoWay's PUBLIC client id, the one withOxyUpdates bakes into
          # the binary's manifest URL (app.config.js). Not a secret.
          OXY_SHIP_CLIENT_ID: oxy_dk_c874d1d7f2b5294583df72d729b0a8cd145bbf1624f85682
          OXY_API_URL: https://api.oxy.so
          SHIP_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          bunx --no-install oxy-ship publish \
            --channel production \
            --platform all \
            --git-commit "$GITHUB_SHA" \
            --message "$SHIP_MESSAGE"
