# GoWay CI.
#
# Every job here is a PRECONDITION of the deploy, not a parallel opinion about
# it. `deploy-aws.yml` is called from THIS file (see the `deploy` job at the
# bottom) rather than triggering on its own `push`, because a deploy workflow
# with its own `on: push` has no dependency on CI at all: the two start in
# parallel on the same commit, a build-and-push is faster than a test suite, and
# the deploy always wins. Measured on OxyHQ/oxy — a merge deployed to production
# while that same commit's tests were still `in_progress`. Every pull request
# genuinely feels protected; the only unprotected path is the one that starts
# after the merge button.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PULL REQUESTS CANCEL; MAIN NEVER DOES, and the second half is a deploy
  # invariant rather than a CI preference. The `deploy` job below is `needs:` the
  # test jobs, so cancelling a main run cancels the deploy with it — and two
  # merges landing inside one CI runtime would mean the FIRST one never deployed
  # at all, with nothing red anywhere. That is self-healing right up until the
  # cancelling commit's own CI fails, or it is the last merge for a while.
  #
  # An EXPRESSION, and the two ways of getting it wrong are NOT symmetric. A
  # mistype that evaluates falsy disables cancelling everywhere: slower pull
  # request CI, main still protected — safe. A mistype in the BRANCH NAME
  # (`refs/heads/mian`) evaluates TRUE on main and silently restores the defect.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The PostGIS image, pinned on BOTH versions and identical to
  # docker-compose.postgres.yml. CI and a developer's machine must not be able
  # to disagree about the version under test: a floating PostGIS minor is a
  # floating set of function VOLATILITIES, and a generated `geography` column
  # needs `ST_MakePoint` to stay IMMUTABLE.
  POSTGIS_IMAGE: postgis/postgis:17-3.5
  # The service container publishes 5432 on the runner; `docker-compose` maps
  # 5440 locally. The URL is stated here once so the test jobs cannot drift.
  DATABASE_URL: postgres://goway:goway@127.0.0.1:5432/goway_test

jobs:
  # Which areas a pull request touches, so the browser gates (`webexport`,
  # `devconsole`, `city3d`) run only when their inputs changed. The 3D legs
  # are this repository's longest jobs and GoWay CI the org's most expensive
  # workflow, so a backend-, docs- or dependency-only pull request should not
  # hold five runners.
  #
  # It RUNS ON EVERY EVENT and is never skipped. On anything that is not a pull
  # request the filter steps are skipped and `web` and `city3d` are `true`, so
  # push to main always runs the full suite. A skipped `changes` would be worse
  # than wasteful: the deploy jobs below use the implicit `success()`, which a
  # skipped ancestor anywhere up the chain turns into a skipped deploy.
  #
  # `web` lists every input of the development export and of the development
  # console gate that drives it: the frontend (app, scripts, fixtures,
  # public/), the SDK and contracts it bundles, any workspace manifest, the
  # root install inputs (manifest, lockfile, bunfig's linker, the solution
  # tsconfig) and this workflow.
  #
  # `city3d` is narrower, and is never true without `web`: what the 3D city
  # visibility gate measures — the engine, its layers, workers, styles and
  # fixtures, the workspace sources it imports, and of the dependencies only
  # those the engine runs (three, MapLibre, …, with their own) or is bundled
  # by. `packages/frontend/scripts/city3dAffected.ts` holds the list and
  # diffs `bun.lock` package by package, so a Bloom or Oxy SDK bump no longer
  # runs the 3D legs. Measured on the 69 merged pull requests before it that
  # touched `web`: 34 change nothing the gate measures.
  #
  # `CI complete` accepts a skipped browser gate only on a pull request where
  # this job SUCCEEDED and said `web=false` (or `city3d=false` for `city3d`).
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      city3d: ${{ github.event_name != 'pull_request' || steps.city3d.outputs.affected == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - 'packages/frontend/**'
              - 'packages/sdk/**'
              - 'packages/maps/**'
              - 'packages/map-service/**'
              - 'packages/contracts/**'
              - 'packages/*/package.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
      # The pull request's merge commit and its base, for the lockfile diff:
      # the first parent is the base branch as GitHub merged it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.filter.outputs.web == 'true'
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.filter.outputs.web == 'true'
        with:
          bun-version-file: package.json
      - name: Does it reach the 3D city visibility gate?
        id: city3d
        if: steps.filter.outputs.web == 'true'
        run: bun packages/frontend/scripts/city3dAffected.ts HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  quality:
    name: Build, typecheck and lint
    runs-on: ubuntu-latest
    # Generous on purpose. A suite consuming most of its budget on a GOOD run
    # has no headroom, so ordinary runner contention flips it to a timeout —
    # which GitHub reports as `cancelled`, indistinguishable from a supersession
    # without doing arithmetic on the job's own timestamps.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # NOT a literal version. `packageManager: "bun@x.y.z"` in package.json
          # is the one pin: check-lockfile-sync.mjs reads it, and
          # check-dockerfile-workspaces.mjs fails when the Dockerfile's literal
          # `FROM oven/bun:<ver>` disagrees with it, so CI, the image and the
          # lockfile gate cannot disagree about which bun wrote bun.lock.
          bun-version-file: package.json
      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only; pin a supported
      # major instead of trusting the runner image's default Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install exact dependency graph
        # --ignore-scripts because the root postinstall builds the contracts and
        # the SDK; both are built explicitly below, in dependency order.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Oxy dependency health
        run: bun run doctor:oxy
      - name: Build the contracts
        # The backend imports @goway/contracts by NAME, which resolves to its
        # built dist/. A warm local tree hides this; a clean checkout does not.
        run: bun run build:contracts

      - name: Build the SDK
        # BEFORE typecheck, not after. packages/frontend imports @goway.to/sdk by
        # NAME, which resolves through the workspace link to packages/sdk/dist —
        # a gitignored build artifact. On a developer's machine the root
        # postinstall has already produced it, so the dependency is invisible;
        # in CI `--ignore-scripts` means nothing has, and typecheck fails with
        # TS2307 on every importing file. Ordering matters here: the SDK bundles
        # @goway/contracts, so it must build after it.
        run: bun run build:sdk
      - name: Build the maps SDK
        # Same reason, one step on: packages/frontend imports @goway.to/maps by
        # name (packages/maps/dist), and the maps SDK imports @goway.to/sdk.
        run: bun run build:maps

      - name: Typecheck
        run: bun run typecheck
      # The developer docs (docs/developers/) name every export of each package
      # entry in its API reference, link only to pages and headings that exist,
      # carry a generated HTTP operation reference that matches the contracts,
      # and hold example code that compiles against this tree. After the builds
      # above: the examples import @goway.to/maps and @goway.to/sdk by name.
      - name: Verify the developer docs
        run: bun run check:docs
      - name: Build the backend
        # `typecheck` runs `bun check` (TypeScript 7), which emits nothing. The
        # runtime image is still compiled by tsc 5.9, so this keeps that
        # compile in CI, as `tsc -b` in `typecheck` used to.
        run: bun run build:backend
      - name: Lint and format (Biome)
        # One root config (`biome.jsonc`) for every package. `ci` is `check`
        # without writes: lint errors AND unformatted files fail.
        run: bunx biome ci .
      - name: Lint the frontend's Expo-only rules (ESLint)
        # The minimal `packages/frontend/eslint.config.js`: only rules Biome has
        # no equivalent for (EXPO_PUBLIC_* inlining, React Compiler rules).
        run: bun run lint:frontend

      - name: Validate the map style documents
        # A broken MapLibre style document fails SILENTLY — a wrong
        # `source-layer` renders nothing, a fontstack the glyph server does not
        # serve renders no text, a moved layer id breaks an overlay's
        # `beforeId` — and none of those crash, log, or fail a render. Nothing
        # above this line can see any of it: the style is data, not code, so
        # typecheck and lint both pass straight over a map that has stopped
        # drawing roads.
        #
        # This step validates `public/map/goway-{light,dark}.json` against the
        # real MapLibre style spec, asserts every source-layer and text-font
        # exists, asserts the documented layer-id contract, asserts light and
        # dark stay in step, and fails if the committed JSON has drifted from
        # `packages/frontend/lib/map/style/`. Offline on purpose: `--online`
        # additionally re-reads OpenFreeMap's TileJSON, which is a third-party
        # endpoint and has no business deciding whether a pull request is green.
        run: bun run --cwd packages/frontend map:style:check

      - name: Check the style picker's thumbnails are of the current styles
        # Each thumbnail is a photograph of one style document by the real
        # renderer (`scripts/build-map-thumbs.ts`), pinned to a hash of that
        # document's layers. A style that changed without a new photograph
        # would show the person a map they do not get. No browser here: the
        # hash is the check; `bun run map:thumbs` retakes them.
        run: bun run --cwd packages/frontend map:thumbs:check

      - name: Validate the generated glyphs and sprite
        # The style document names `/map/fonts/{fontstack}/{range}.pbf` and
        # `/map/sprites/goway`, and both are GENERATED, COMMITTED artefacts.
        # Drift between the generator and the committed bytes is the same class
        # of silent failure the style check exists for, one layer down: a
        # fontstack renamed in `schema.ts` without a regeneration is a 404 on
        # every glyph range, which renders a map with no labels at all and logs
        # nothing a CI job can see.
        #
        # Both scripts are deterministic by construction, so `--check` is a
        # byte comparison and not an approximation.
        #
        # The glyph check also asserts COMPLETENESS, which is the other silent
        # failure: the Worker chooses between a committed range and the upstream
        # Noto proxy on whether the asset EXISTS, so a range file that exists and
        # is short is not a partial answer — it is the whole answer, and the
        # fallback can never fire for it. Every published range is measured
        # against `scripts/mapgen/fixtures/fallback/coverage.json` and the build
        # fails on one with a hole in it.
        run: |
          bun run --cwd packages/frontend map:glyphs:check
          bun run --cwd packages/frontend map:sprite:check

      - name: Validate the brand assets
        # `public/brand/*.svg` is GoWay's logo as files — the favicon, and the
        # copy a partner embedding `/frame` will put in their own page. The app
        # itself never loads them: it draws the logo from
        # `components/brand/artwork.ts`, which means the files and the product
        # are two copies of one drawing and nothing but this step notices when
        # they stop matching. The failure is silent and slow — the mark on the
        # website quietly stops being the mark in the app, and somebody spots it
        # a release later with the two side by side.
        #
        # A byte comparison of the whole document, so a changed viewBox, colour
        # or label fails it as surely as changed geometry does.
        run: bun run --cwd packages/frontend brand:check

      - name: Validate the landmark models
        # `public/landmarks/*.glb` are GENERATED from the procedural sources in
        # `scripts/landmarks/models/`, and `registry.json` records each one's
        # bytes, SHA-256, triangles and licence (docs/MAP_LANDMARKS.md). A
        # source edited without rebuilding ships a model that is not what the
        # code says, and a budget or licence field that no longer holds; the
        # check rebuilds everything in memory and compares bytes.
        run: bun run --cwd packages/frontend landmarks:check

      - name: Test the frontend's pure modules
        # These suites EXISTED before this step did and nothing ran them —
        # `bun run test` covered the backend and the SDK only, so
        # `components/map/__tests__/nanCoordinates.test.ts` (the net under the
        # crash that once replaced goway.to with its error boundary) was dead
        # weight in the repository for as long as it had been there.
        #
        # Everything here is a pure module: coordinate validation, the embed
        # parameter parser, and the map Worker's routing. No renderer, no
        # native module, no Expo runtime — so it needs none of the setup a
        # component test would, and it takes well under a second.
        #
        # `map-service/src/index.js` is the one that could not be checked any other way.
        # `tsc` does not read it, `expo export` does not bundle it, and its
        # first execution would otherwise be in production.
        run: bun run test:frontend

      # The SDK is checked HERE rather than in the `test` job because it needs
      # no database — it is a headless client tested against an injected fake
      # `fetch`. `smoke` is the step that matters most: it packs a real tarball
      # and imports it under Node ESM, Node CJS, Bun, a browser bundle and a
      # react-native bundle. A published SDK whose `exports` targets do not
      # exist is a failure no typecheck can see, and the ecosystem has shipped
      # exactly that before (@oxyhq/services@30.0.0, `lib/` empty, 26 of 33
      # exports targets pointing at nothing — `npm publish <tarball>` runs zero
      # lifecycle scripts, so nothing was there to catch it).
      - name: Serve tiles through the real Workers runtime (gzip layers on the wire)
        # The unit tests cannot see encoding: Bun's Response ignores
        # `encodeBody`, and the map went blank once for exactly that (#68).
        # This runs worker/ under workerd (Miniflare) and counts gzip layers
        # for a miss and a hit, for gzip, identity, br-only and no-header
        # clients — and proves it can fail on a Worker that double-encodes.
        run: bun run --cwd packages/frontend check:worker-wire

      - name: Test the SDK
        run: bun run test:sdk
      - name: Test the maps SDK
        run: bun run test:maps
      - name: Test the map origin's Worker
        run: bun run test:map-service

      - name: Smoke-test the published SDK tarball
        # The build already ran above; this packs what it produced.
        run: bun run smoke:sdk

  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install exact dependency graph
        # check-migration-phases.mjs imports `readMigrationPhases` from
        # `@oxy.so/db/migrate` rather than carrying a second copy of the marker
        # regex, so it needs node_modules. That import is the point: a gate and a
        # migrator with separate copies of the rule eventually disagree, and the
        # disagreement surfaces as a migration that passes CI and refuses to
        # apply.
        run: bun install --frozen-lockfile --ignore-scripts
      # Each gate's own fixture tests run BEFORE the gate itself, and that order
      # is the point. GoWay has zero migrations today, so both migration gates
      # scan an empty folder on this tree and cannot tell a clean result from a
      # traversal that stopped working. The fixture runs are what prove they can
      # fail at all; without them the two steps below would be decoration.
      - name: Prove the migration and contract gates can fail
        run: bun run test:gates
      - name: Verify AGENTS.md byte budget
        run: bun run validate:agents-md
      - name: Verify migration deploy phases and parameters
        run: bun run check:migrations
      # The OpenAPI document and the JSON Schemas are GENERATED from the zod
      # contracts the API validates with. A contract change that did not
      # regenerate `packages/contracts/openapi.json`, an operation dropped from
      # the registry, or a schema zod cannot convert fails here rather than in
      # an integrator's generated client. Read from source: no build needed.
      - name: Verify the OpenAPI document is fresh and complete
        run: bun run check:openapi
      - name: Verify every contract schema converts to JSON Schema
        run: bun run check:contracts

      # A workspace member missing from the backend Dockerfile only fails
      # inside a container build — the most expensive place to learn it,
      # and one no developer machine exercises. packages/sdk was absent for
      # five merges and stayed invisible because the deploy job never got
      # as far as the image build.
      - name: Test backend deployment safety
        run: python3 -m unittest discover -s .github/scripts -p test_deploy_backend.py

      - name: Verify the Dockerfile copies every workspace manifest
        run: bun run check:dockerfile

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

  # The DEVELOPMENT export both browser gates below drive, built ONCE per run
  # and handed to every leg as an artifact. It was exported four times per run
  # (each `city3d` leg and the `devconsole` job), ~2 min each, from the
  # same commit with the same command. A DEVELOPMENT build because only a dev
  # build publishes what the engine drew (`__gowayCity3d`), which is what makes
  # a blank screen fail rather than pass as "nothing to draw" — and only a dev
  # build honours the `?city3d=1&cityTiles=1&citysky=1` the gate opens it with,
  # and only a dev build reports gesture/worklet misuse at all.
  #
  # Artifacts are scoped to their own run, so no other pull request can supply
  # this one; `retention-days: 1` because nothing reads it after the run.
  webexport:
    name: Export the web app (development build)
    needs: changes
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only; pin a supported
      # major instead of trusting the runner image's default Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the contracts
        run: bun run build:contracts
      - name: Build the SDK
        run: bun run build:sdk
      - name: Build the maps SDK
        run: bun run build:maps
      - name: Export the web app (development build)
        working-directory: packages/frontend
        run: bun run export:web --dev --output-dir "$RUNNER_TEMP/web-export-dev"
      - name: Pack the export
        # One tarball, not the tree: it keeps every file name, dotfile and mode
        # exactly as Metro wrote them, and uploads as one file.
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/web-export-dev.tgz" web-export-dev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: web-export-dev
          path: ${{ runner.temp }}/web-export-dev.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The 3D city's VISIBILITY gate (docs/MAP_NATIVE_3D.md, "The visibility
  # gate"): the real app, exported, in headless Chromium on SwiftShader, over a
  # committed synthetic city, with terrain held back until the city has drawn.
  # It asserts that what the engine counts as drawn is on the screen. Every
  # other 3D city gate runs without a GPU and could not see trees and
  # buildings buried under the terrain (#152): the engine counted all of them
  # as drawn. Nothing comes from the network, and software GL is enough
  # because the assertions are coverage, not frame time.
  #
  # SHARDED by check, not by sky. On two cores of software GL a view takes
  # 1-2 minutes, and the gate's checks add up to ~28 min of views (median,
  # measured per view over 17 runs); one leg per sky put 13-25 min of them on
  # the sky leg alone, against a 30 min timeout that run 39822429503 hit.
  # `city3dShards.ts` deals the checks out longest first by their measured
  # cost, so the five shards hold 5.5-5.8 min each. The shard is
  # `strategy.job-index` of `strategy.job-total`, never a number written here
  # twice: a shard added to or dropped from the matrix re-deals every check,
  # and none can fall out. `CI complete` needs `city3d`, whose result is a
  # success only when every shard's is.
  #
  # Chromium only, no `--with-deps`: the runner image already carries every
  # library the headless shell loads, and the apt run added only fonts and
  # Xvfb, which a headless shell drawing map glyphs from `public/map` uses
  # neither of. It was the legs' one network dependency on apt: 6 min 50 s at
  # 63 kB/s on one leg of 39917475020, and a `403` from packages.microsoft.com
  # that failed 39694073332's objects leg before it began.
  city3d:
    name: 3D city visibility (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, webexport]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.city3d == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      # The gate imports the SDK's geometry, which resolves to its build.
      - name: Build the contracts
        run: bun run build:contracts
      - name: Build the SDK
        run: bun run build:sdk
      - name: Install Chromium for playwright-core
        run: bunx playwright-core install --only-shell chromium
      - name: Fetch this run's development export
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-export-dev
          path: ${{ runner.temp }}
      - name: Unpack the development export
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/web-export-dev.tgz"
          test -f "$RUNNER_TEMP/web-export-dev/index.html"
      - name: What the engine drew is on the screen
        id: city3d
        run: >-
          bun run --cwd packages/frontend check:city3d-visible
          --dist="$RUNNER_TEMP/web-export-dev" --out="$RUNNER_TEMP/city3d-visible"
          --shard=${{ strategy.job-index }}/${{ strategy.job-total }}
      - name: Keep the screenshots of a failed run
        if: ${{ !cancelled() && steps.city3d.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: city3d-visible-${{ matrix.shard }}
          path: ${{ runner.temp }}/city3d-visible
          retention-days: 14

  # The DEVELOPMENT CONSOLE gate (`packages/frontend/scripts/check-dev-console.ts`):
  # the real app, the same development export, at phone size in headless
  # Chromium, driven through map settings, the style picker, the sheet's drags
  # and a place. React Native Gesture Handler, Reanimated and Worklets report
  # their misuse only in a development build, at runtime, as a red toast
  # ("[react-native-gesture-handler] Some of the callbacks in the gesture are
  # worklets and some are not": the map sheet's body pan) — no type, unit
  # test or production build sees it. Nothing from the stack may speak, and
  # nothing may throw. Fixtures answer places; every other request is refused.
  #
  # A job of its own, on the `web` filter: it loads the whole app, so a pull
  # request that skips the 3D legs still runs it. It needs no workspace build
  # (playwright-core and the export server only); ~25 s of gate.
  devconsole:
    name: Development console
    needs: [changes, webexport]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for playwright-core
        run: bunx playwright-core install --only-shell chromium
      - name: Fetch this run's development export
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: web-export-dev
          path: ${{ runner.temp }}
      - name: Unpack the development export
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/web-export-dev.tgz"
          test -f "$RUNNER_TEMP/web-export-dev/index.html"
      - name: "Development console: nothing from the gesture and animation stack, nothing uncaught"
        id: devconsole
        run: >-
          bun run --cwd packages/frontend check:dev-console
          --dist="$RUNNER_TEMP/web-export-dev" --out="$RUNNER_TEMP/dev-console-shots"
      - name: Keep the development console screenshots of a failed run
        if: ${{ !cancelled() && steps.devconsole.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dev-console
          path: ${{ runner.temp }}/dev-console-shots
          retention-days: 14

  worker:
    name: Reconstruction worker
    runs-on: ubuntu-latest
    # The worker's environment is the uv.lock, CUDA toolkit wheels included, so
    # installing it here is the reproducibility check: a lock that drifted from
    # pyproject.toml fails `--locked`. The tests need no GPU: they cover the job
    # contract against the fixtures the backend also parses, SPZ encoding, the
    # privacy redaction and metadata gate, the cache/ledger and the geometry.
    # Real GPU reconstruction is validated on the external worker with
    # `worker:doctor --smoke` and an end-to-end job, never claimed by this job.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/reconstruction-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/reconstruction-worker/uv.lock
      # `--locked` trusts the lock as written and never re-resolves fused-ssim,
      # so it passed while every relock (Dependabot's included) died building
      # fused-ssim without torch. Re-resolving that one package, in a runner
      # with no torch, is what proves the lock can still be regenerated.
      - name: The lock re-resolves without a built environment
        run: uv lock --dry-run --upgrade-package fused-ssim
      - name: Install the locked environment
        run: uv sync --locked
      - name: Test the worker
        run: uv run --locked pytest -q

  lockfile:
    name: Lockfile sync
    runs-on: ubuntu-latest
    # Its own job, and it CANNOT be folded into `quality`. The gate needs a plain
    # `bun install` to see what the lockfile would become, and `quality` installs
    # with `--frozen-lockfile`; the two cannot share a checkout. (Nor can
    # `--frozen-lockfile` be the gate: measured on bun, it exits 0 on a workspace
    # version bumped without regenerating the lockfile.) The install per fixture
    # is why the budget is larger than the work looks.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Prove the lockfile gate can fail
        run: bun run test:gates:lockfile
      - name: Verify bun.lock was committed with its manifest change
        run: bun run check:lockfile

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    # x86 REQUIRED, and not a preference. ARM runners (`ubuntu-*-arm`) have no
    # service containers at all, and `postgis/postgis` publishes no arm64 image —
    # either one alone makes the `services:` block below impossible.
    timeout-minutes: 30

    services:
      postgres:
        # The SAME tag docker-compose.postgres.yml pins. `env.POSTGIS_IMAGE`
        # cannot be used here — GitHub does not evaluate `env` in a `services`
        # image — so the string is repeated and the `image-pin` step below
        # asserts the two still match rather than trusting a comment to keep
        # them in step.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: goway
          POSTGRES_PASSWORD: goway
          POSTGRES_DB: goway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goway -d goway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        # GoWay Live's bus between API tasks (`live/cluster.ts`): its leases,
        # demand and fan-out are tested against a real server, the engine
        # production runs (ElastiCache Valkey 8.0), not only an in-memory fake.
        image: valkey/valkey:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Assert the service container and docker-compose pin the same image
        # A comment saying "keep these in sync" is not a gate. This compares the
        # tag this job actually started against the one a developer runs, and
        # fails if they diverge — the divergence being a PostGIS version whose
        # function volatilities differ from the ones the migrations were
        # generated against.
        run: |
          set -euo pipefail
          compose_image=$(grep -oE 'postgis/postgis:[0-9]+-[0-9.]+' docker-compose.postgres.yml | head -1)
          workflow_image=$(grep -oE 'postgis/postgis:[0-9]+-[0-9.]+' .github/workflows/ci.yml | sort -u)
          echo "compose:  $compose_image"
          echo "workflow: $workflow_image"
          test -n "$compose_image"
          test "$(printf '%s\n' "$workflow_image" | wc -l)" = "1"
          test "$compose_image" = "$workflow_image"
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the contracts
        run: bun run build:contracts
      - name: Apply migrations
        # The migrator, not `drizzle-kit migrate` — the same code path production
        # runs, including the PostGIS `CREATE EXTENSION` precondition. It is what
        # proves the image, the extension registry and the migrations agree; the
        # extension is NOT seeded into a database the image did not create.
        #
        # `--target-database` is required on every run, dry runs included: pointed
        # at the wrong database a migrator finds an empty ledger, applies the whole
        # journal, logs `Applied N` and exits 0.
        run: bun run db:migrate --target-database=goway_test
      - name: Verify PostGIS is installed
        # A positive control for the step above. With zero migrations to apply,
        # `runMigrations` short-circuits before `ensureExtensions` — so a green
        # migrate step is not yet evidence the extension exists, and this reads
        # it back from the catalogue instead of inferring it.
        run: |
          set -euo pipefail
          PGPASSWORD=goway psql -h 127.0.0.1 -p 5432 -U goway -d goway_test \
            -v ON_ERROR_STOP=1 -tAc "CREATE EXTENSION IF NOT EXISTS postgis;"
          version=$(PGPASSWORD=goway psql -h 127.0.0.1 -p 5432 -U goway -d goway_test \
            -v ON_ERROR_STOP=1 -tAc "SELECT postgis_lib_version();")
          echo "PostGIS $version"
          case "$version" in 3.5.*) ;; *) echo "::error::expected PostGIS 3.5.x, got $version"; exit 1 ;; esac
      - name: Install a Redis server binary for the live bus outage test
        # `live/__tests__/cluster.test.ts` stops and restarts a server of its
        # own (on a random port) to prove the tasks recover from a Valkey
        # outage; the service container above cannot be stopped from a test.
        # policy-rc.d keeps apt from starting it on 6379, which the Valkey
        # service already holds.
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          redis-server --version
      - name: Run the backend test suite
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:6379
        run: bun run test:backend

  # THE one status check `main` should require. Everything above reports here.
  #
  # Requiring the test jobs by NAME in branch protection cannot work: a required
  # check that never reports blocks the pull request forever, so every required
  # name would have to be a job that runs on every pull request for all time —
  # and the list would live in a repository setting nothing in this tree can see,
  # so a job added later would be required by nothing with no signal in the diff.
  #
  # `if: always()` is what makes this reachable when something above it failed,
  # was cancelled or skipped. Without it this job inherits their skip and — as a
  # required check reporting `skipped` — is never satisfied.
  ci-complete:
    name: CI complete
    needs: [changes, quality, gates, webexport, devconsole, city3d, lockfile, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Gate on job NAMES, never on counts. "No checks reported" and
          # "everything passed" are the same `fail=0 pending=0` to a counter, and
          # a GraphQL 503 during a forge outage reads identically to both.
          #
          # Every name is listed here AND in `needs:` above. A job missing from
          # NEEDS_JSON fails: unknown is not good news.
          expected="changes quality gates webexport devconsole city3d lockfile test"
          # The ONLY jobs that may be skipped, and only by the `changes`
          # filter: on a pull request, with `changes` itself a success that
          # reported the job's own filter `false` — `web` for the export and
          # the development console, `city3d` (never true without `web`) for
          # the 3D legs. Push to main never filters (both are `true`), so a
          # skip there fails like any other.
          filter_of() {
            case "$1" in
              webexport | devconsole) echo web ;;
              city3d) echo city3d ;;
              *) echo none ;;
            esac
          }
          changes_result=$(printf '%s' "$NEEDS_JSON" | jq -r '.changes.result // "MISSING"')
          filters_trusted=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$changes_result" = "success" ]; then
            filters_trusted=true
          fi
          echo "event=$EVENT_NAME changes=$changes_result filters_trusted=$filters_trusted"
          verdict=0
          for job in $expected; do
            result=$(printf '%s' "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "MISSING"')
            printf '%-12s %s\n' "$job" "$result"
            # `cancelled` fails. A cancelled job verified nothing, and
            # cancellation is common precisely when several pushes race — the
            # moment this gate matters most. `skipped` fails too, except for a
            # path-filtered job the `changes` filter legitimately turned off.
            if [ "$result" = "success" ]; then continue; fi
            filter=$(filter_of "$job")
            said=$(printf '%s' "$NEEDS_JSON" | jq -r --arg f "$filter" '.changes.outputs[$f] // "MISSING"')
            if [ "$result" = "skipped" ] && [ "$filters_trusted" = "true" ] && [ "$said" = "false" ]; then
              echo "  ^ skipped: this pull request changes none of its inputs ($filter=false)"
              continue
            fi
            verdict=1
          done
          # Coverage floor: the `needs` context must hold exactly the jobs named
          # above. A job added to `needs:` but not to `expected` would otherwise
          # be silently unchecked.
          actual=$(printf '%s' "$NEEDS_JSON" | jq -r 'keys | join(" ")')
          wanted=$(printf '%s\n' $expected | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$actual" != "$wanted" ]; then
            echo "::error::needs holds [$actual] but this gate checks [$wanted]; every job must be in both."
            verdict=1
          fi
          exit $verdict

  # The deploy, as a JOB of this workflow rather than a workflow with its own
  # trigger. `needs:` is what makes it impossible for the rollout to start before
  # the suites that gate it have finished.
  #
  # `secrets: inherit` because the called workflow assumes an OIDC role and syncs
  # the runtime secret allowlist to SSM; it declares its own `permissions`.
  # No `timeout-minutes` here: GitHub does not accept it on a job that calls a
  # reusable workflow. The budget lives on the called workflow's own job.
  deploy:
    name: Deploy
    needs: [quality, gates, webexport, devconsole, city3d, worker, lockfile, test]
    # GATED ON A REPOSITORY VARIABLE, because the AWS side does not exist yet.
    #
    # `deploy-aws.yml` assumes an IAM role `oxy-goway-github-deploy`, an ECR
    # repository `oxy/goway` and an ECS service, none of which are provisioned.
    # It therefore failed on the FIRST step — the OIDC credential exchange — on
    # every one of the first five merges to main, and nobody noticed: the job
    # runs on `push`, after the merge button, so a green pull request tells you
    # nothing about it.
    #
    # The two obvious fixes are both wrong. Deleting the job loses the wiring
    # that took a `startup_failure` to get right. `continue-on-error` makes it
    # green while it fails, which is how a deploy becomes invisible — the exact
    # defect this file's header argues against for `on: push` deploys.
    #
    # A variable is neither: unset, the job is SKIPPED, which is honest about a
    # deploy that genuinely cannot run, and main stops being red for a reason
    # unrelated to any diff. Set `AWS_DEPLOY_ENABLED` to `true` once
    # `terraform-uswest2/app-goway.tf` and `iam-goway-deploy.tf` are applied,
    # and the job arms itself with no workflow edit. `vars` is used rather than
    # `secrets` deliberately: the `secrets` context is not available in a
    # job-level `if`, and this is configuration, not a credential.
    if: >-
      ${{ vars.OXY_1519_ROLLOUT_HOLD != 'true' && (github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.AWS_DEPLOY_ENABLED == 'true') }}
    # A called workflow cannot ELEVATE permissions beyond what the caller grants,
    # and the workflow-level grant above is `contents: read`. deploy-aws.yml
    # declares `id-token: write` for the AWS OIDC exchange, so without this job
    # scope the whole workflow fails VALIDATION — `startup_failure`, with no jobs
    # and no log, which reads on the pull request as GoWay's CI simply being
    # absent while the third-party checks go green.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-aws.yml
    secrets: inherit

  # The web app, deployed the same way and for the same reason: a workflow with
  # its own `push` trigger would race these jobs and win. It is NOT `needs:` the
  # backend deploy above — the two are independent today, because the exported
  # bundle runs on the fixture transport in
  # `packages/frontend/lib/goway/client.ts` and makes no call to `api.goway.to`
  # at all. Coupling them would mean a red backend rollout leaves `goway.to`
  # serving a stale build for no reason.
  #
  # `contents: read` only: deploy-frontend.yml talks to Cloudflare with an API
  # token from `secrets`, not to AWS over OIDC, so it needs no `id-token`.
  deploy-frontend:
    name: Deploy frontend
    needs: [quality, gates, webexport, devconsole, city3d, lockfile, test]
    if: >-
      ${{ vars.OXY_1519_ROLLOUT_HOLD != 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
