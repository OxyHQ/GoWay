# Deploy the GoWay backend to AWS ECS (Fargate, linux/arm64) via GitHub OIDC.
#
# ## This workflow has NO trigger of its own, deliberately
#
# It is CALLED by `ci.yml` (`jobs.deploy.uses`) with `needs:` the test jobs, so
# the rollout cannot start until they have passed. It used to be
# `on: push: branches: [main]`, which is the shape that has no dependency on CI
# at all: the two workflows start in parallel on the same commit, a
# build-and-push is faster than a full test suite, and the deploy always wins the
# race. Measured on OxyHQ/oxy — a merge deployed to production while that same
# commit's `API Tests` job was still `in_progress`. Every pull request feels
# protected; the only unprotected path is the one that starts after the merge
# button.
#
# `workflow_dispatch` remains, as the manual escape hatch for a re-deploy of a
# commit that is already green.
#
# Keep the bun version here aligned with the Dockerfile's `FROM oven/bun:<ver>`;
# `bun-version-file: package.json` is how the rest of CI does it.
name: Deploy to AWS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: goway
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    # A backstop, with headroom: an arm64 image build plus an ECR push is the
    # long pole and runs well inside this. A job whose typical duration exceeds
    # roughly two-thirds of its timeout fails intermittently for reasons
    # unrelated to any diff — and a job-level timeout reports `cancelled`, which
    # reads as a supersession rather than a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # For `scripts/check-routing.mjs` at the end of this job. Version from
      # `packageManager` in package.json, exactly as ci.yml and
      # deploy-frontend.yml do it, so CI, the image and this deploy cannot
      # disagree about which bun ran what.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          # This role must trust only this repository and grant access only to
          # this app's SSM path, ECR repository, and ECS service. Never replace
          # it with a role shared by generated repositories.
          role-to-assume: arn:aws:iam::237343248947:role/oxy-goway-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        # Each secret is named EXPLICITLY. Enumerating the whole secrets
        # context in one expression is forbidden fleet-wide
        # (`~/Oxy/oxy-infra/AGENTS.md` §Secrets): GitHub reads that as an
        # exfiltration payload, and every run then completes `action_required`
        # with ZERO jobs until a human approves it, per run. The expression is
        # not spelled out anywhere in this file on purpose — the detector is
        # worth assuming is textual, and a comment is still text. That failure is invisible in the
        # worst way — a run with no jobs reads as "no checks reported", which is
        # indistinguishable from "nothing to do" unless you gate on job NAMES.
        #
        # This list IS the allowlist now, rather than a filter applied to
        # everything: an unrelated CI token cannot reach SSM because it is never
        # read in the first place. Adding a runtime secret means adding it here
        # AND to the ECS task definition's `secrets[]` — the task definition is
        # the authority on what the service actually receives.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OXY_SERVICE_API_KEY: ${{ secrets.OXY_SERVICE_API_KEY }}
          OXY_SERVICE_API_SECRET: ${{ secrets.OXY_SERVICE_API_SECRET }}
        run: |
          set -euo pipefail
          for k in DATABASE_URL REDIS_URL OXY_SERVICE_API_KEY OXY_SERVICE_API_SECRET; do
            v="${!k-}"
            # A placeholder is worse than an absent secret: the sync would
            # overwrite a real SSM value and crash-loop the service.
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            path="/oxy/$APP/$k"
            printf '%s' "$v" | aws ssm put-parameter \
              --name "$path" \
              --type SecureString \
              --value file:///dev/stdin \
              --overwrite >/dev/null
            echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push (linux/arm64)
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker build -f "$DOCKERFILE" -t "$IMG:${{ github.sha }}" -t "$IMG:latest" .
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"

      - name: Deploy to ECS (skipped until the service exists)
        id: deploy
        run: |
          set -euo pipefail
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
            echo "rolled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The deployment id is captured, not discarded. Everything below waits
          # on THIS rollout by id; asking the service whether it is "stable"
          # instead lets a rollout that finished BEFORE this step began answer
          # for the one that has not started yet.
          deployment=$(aws ecs update-service --cluster "$CLUSTER" --service "$APP" \
            --force-new-deployment --query 'service.deployments[?status==`PRIMARY`].id' --output text)
          echo "Triggered deployment $deployment for $APP"
          echo "rolled=true" >> "$GITHUB_OUTPUT"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      # WAIT FOR IT, AND FAIL IF IT DID NOT TAKE.
      #
      # `update-service` returning is not a deploy. It queues one. Without this
      # step the job goes green the moment the queue accepts the request, and
      # the thing that actually happens next is invisible — which is not a
      # hypothetical: on 2026-09-20 four consecutive merges reported a
      # successful deploy while every rollout failed and rolled back, because
      # the new image shipped a migration (`0001_goway_capture`) that nobody had
      # applied. `/ready` answers 503 until the schema is current, the target
      # group refused every new task, the circuit breaker restored the old one,
      # and api.goway.to served a four-hour-old build for the rest of the day
      # with four green checkmarks above it.
      #
      # The failure is then reported with the ONE instruction that fixes it,
      # because "tasks failed to start" sends a reader to the wrong place.
      #
      # ## And it polls the DEPLOYMENT, not the service
      #
      # `aws ecs wait services-stable` cannot answer this question. Its success
      # condition is "one deployment, and runningCount == desiredCount", which
      # is true of the PREVIOUS rollout for as long as it takes ECS to register
      # the new one — and true again for the ~30 s between the old task
      # draining and ECS marking the new deployment COMPLETED. It reported both
      # on its first run: a rollout that was entirely healthy (task started,
      # registered, old one drained) failed this job because the waiter was
      # satisfied one poll before `rolloutState` flipped.
      #
      # Same lesson as the frontend deploy's entry-bundle check (#53): poll the
      # thing you actually care about, keyed to the artefact this run produced,
      # instead of sampling a proxy for it.
      - name: Wait for THIS rollout, and say what went wrong if it failed
        if: steps.deploy.outputs.rolled == 'true'
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment }}
        run: |
          set -euo pipefail
          echo "Waiting for deployment $DEPLOYMENT…"
          # 15 minutes: an arm64 image pull plus two 30 s health checks plus the
          # old task's deregistration delay, with room for a slow ECR.
          deadline=$(( SECONDS + 900 ))
          while :; do
            state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
              --query "services[0].deployments[?id=='$DEPLOYMENT'].rolloutState | [0]" --output text)
            case "$state" in
              COMPLETED)
                echo "Rollout completed."
                exit 0
                ;;
              FAILED)
                echo "::error::Deployment $DEPLOYMENT FAILED. The circuit breaker has restored the previous image."
                break
                ;;
              None|'')
                # The deployment is no longer on the service: it was rolled
                # back, or a later merge superseded it. Either way this run
                # cannot claim its image is serving, and the events below say
                # which of the two it was.
                echo "::error::Deployment $DEPLOYMENT is gone before completing — rolled back, or superseded by a later deploy."
                break
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::Deployment $DEPLOYMENT was still $state after 15 minutes."
              break
            fi
            echo "  $state ($(( deadline - SECONDS ))s left)"
            sleep 15
          done
          echo "--- recent service events ---"
          aws ecs describe-services --cluster "$CLUSTER" --services "$APP" \
            --query 'services[0].events[0:12].[createdAt,message]' --output text
          cat <<'HINT'
          ::error::If the events say tasks failed to start and /ready returned 503, the
          most likely cause is a migration shipped in this image that has not been
          applied. `/ready` checks the migration journal, so an unmigrated database takes
          every new task out of the target group and the circuit breaker restores the old
          one. Apply it with the one-shot task documented in oxy-infra
          terraform-uswest2/app-goway.tf step 5, then re-run this workflow:

            aws ecs run-task --cluster oxy-cluster --task-definition oxy-goway \
              --launch-type FARGATE --network-configuration '<the service's own>' \
              --overrides '{"containerOverrides":[{"name":"goway","command":[
                 "bun","packages/backend/dist/src/db/migrate.js","--target-database=goway"]}]}'
          HINT
          exit 1

      # THE assertion that cannot pass while the bug is present.
      #
      # Everything above proves an image was built and a task is running.
      # Nothing above proves GoWay can work out how to get from one place to
      # another, and that is the thing that was broken: `POST /routes` answered
      # `service_unavailable` in production for as long as it existed, and the
      # web app drew the crow's path instead. `scripts/check-routing.mjs` asks
      # api.goway.to for Barcelona → Madrid, signed out, and fails unless the
      # answer is LONGER than the 505 km great circle, carries hundreds of
      # coordinates and names real roads. A straight line cannot satisfy it.
      - name: Prove directions follow roads
        if: steps.deploy.outputs.rolled == 'true'
        env:
          GOWAY_API_URL: https://api.goway.to
        run: bun scripts/check-routing.mjs
