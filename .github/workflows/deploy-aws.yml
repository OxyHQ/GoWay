# Deploy the GoWay backend to AWS ECS (Fargate, linux/arm64) via GitHub OIDC.
#
# ## This workflow has NO trigger of its own, deliberately
#
# It is CALLED by `ci.yml` (`jobs.deploy.uses`) with `needs:` the test jobs, so
# the rollout cannot start until they have passed. It used to be
# `on: push: branches: [main]`, which is the shape that has no dependency on CI
# at all: the two workflows start in parallel on the same commit, a
# build-and-push is faster than a full test suite, and the deploy always wins the
# race. Measured on OxyHQ/oxy — a merge deployed to production while that same
# commit's `API Tests` job was still `in_progress`. Every pull request feels
# protected; the only unprotected path is the one that starts after the merge
# button.
#
# `workflow_dispatch` remains, as the manual escape hatch for a re-deploy of a
# commit that is already green.
#
# Keep the bun version here aligned with the Dockerfile's `FROM oven/bun:<ver>`;
# `bun-version-file: package.json` is how the rest of CI does it.
name: Deploy to AWS

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      task_definition:
        description: 'Exact reviewed infrastructure task definition ARN to adopt (optional)'
        type: string
        required: false
      restore_capacity:
        description: 'Restore a paused backend to one CPU service task'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: goway
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # A backstop, with headroom: an arm64 image build plus an ECR push is the
    # long pole and runs well inside this. A job whose typical duration exceeds
    # roughly two-thirds of its timeout fails intermittently for reasons
    # unrelated to any diff — and a job-level timeout reports `cancelled`, which
    # reads as a supersession rather than a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # For `scripts/check-routing.mjs` at the end of this job. Version from
      # `packageManager` in package.json, exactly as ci.yml and
      # deploy-frontend.yml do it, so CI, the image and this deploy cannot
      # disagree about which bun ran what.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          # This role must trust only this repository and grant access only to
          # this app's ECR repository and ECS service. (Its ssm:PutParameter
          # grant on /oxy/goway/* is unused since the deploy stopped writing SSM.) Never replace
          # it with a role shared by generated repositories.
          role-to-assume: arn:aws:iam::237343248947:role/oxy-goway-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets live ONLY in SSM /oxy/goway/* (SecureString); the task
      # definition reads them at task start and this deploy writes none. Set or
      # rotate one with `aws ssm put-parameter --overwrite` (oxy-infra runbook
      # 46). Until 2026-10-10 a step here copied GitHub repo secrets into SSM.
      # .github/scripts/test_deploy_backend.py fails CI if a workflow writes SSM
      # or reads a repo secret beyond the CI-only allowlist.

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only ci.yml's
      # deploy job on a push to main, or a dispatch, runs this workflow, so
      # pull-request code never writes this cache scope.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      # Same Dockerfile, context, platform and tags as the plain `docker build`
      # this replaces, pushed in the same step. --provenance=false keeps the
      # pushed artefact a single-platform image manifest, as before, rather
      # than an index with an attestation.
      - name: Build and push (linux/arm64)
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            --provenance=false \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .

      - name: Migrate and deploy the immutable image
        id: deploy
        env:
          RESTORE_CAPACITY: ${{ inputs.restore_capacity || 'false' }}
          TASK_DEFINITION: ${{ inputs.task_definition || '' }}
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "oxy/$APP" --image-ids imageTag="${{ github.sha }}" --query 'imageDetails[0].imageDigest' --output text)
          args=()
          if [ "$RESTORE_CAPACITY" = 'true' ]; then args+=(--restore-capacity); fi
          if [ -n "$TASK_DEFINITION" ]; then args+=(--task-definition "$TASK_DEFINITION"); fi
          python3 .github/scripts/deploy-backend.py \
            --cluster "$CLUSTER" --service "$APP" --database goway \
            --execution-role arn:aws:iam::237343248947:role/oxy-goway-execution \
            --image "$ECR_REGISTRY/oxy/$APP@$digest" "${args[@]}"
          echo "rolled=true" >> "$GITHUB_OUTPUT"

      # Nothing above proves GoWay can work out how to get from one place to
      # another, and that is the thing that was broken: `POST /routes` answered
      # `service_unavailable` in production for as long as it existed, and the
      # web app drew the crow's path instead. `scripts/check-routing.mjs` asks
      # api.goway.to for Barcelona → Madrid, signed out, and fails unless the
      # answer is LONGER than the 505 km great circle, carries hundreds of
      # coordinates and names real roads. A straight line cannot satisfy it.
      - name: Verify the canonical browser can reach contribution endpoints
        run: python3 .github/scripts/check-browser-cors.py

      - name: Prove directions follow roads
        if: steps.deploy.outputs.rolled == 'true'
        env:
          GOWAY_API_URL: https://api.goway.to
        run: bun scripts/check-routing.mjs
