# Build GoWay's own bare-earth terrain, set by set and cell by cell, and —
# only when asked — publish it to R2.
#
# Design, sources and licences, the contamination gate, measurements, cost and
# the approval steps: docs/MAP_TERRAIN_GLOBE.md → "The archive".
#
# ## What a job does
#
# A set (packages/frontend/scripts/terrain/catalogue.ts) is cut into z7 cells,
# one PMTiles archive each; a job builds a batch of one set's cells. Each cell
# is processed in z10 blocks: the source warped to a z14 analysis grid with
# heights in EGM2008, judged against GoWay's city-tile footprints and ESA
# WorldCover's tree stands, feathered into the fallback terrain (Mapterhorn)
# where it ends, averaged down to z12 and the pyramid (z7–12), encoded as
# Terrarium lossless WebP, packed, read back with the Worker's own reader, and
# described by a receipt carrying the gate's numbers. GDAL, PROJ's grids and
# p7zip are conda-forge's, pinned in packages/frontend/scripts/terrain/environment.yml
# — the same as locally.
#
# ## Dry run by default
#
# `publish` is off unless set. Off, every cell is built and verified and the
# entries, receipts and the manifest the run WOULD write are kept as
# artifacts; nothing leaves GitHub. On, archives go up under dated keys that
# are never overwritten (`city-r2.sh`, shared with the city tiles and the
# imagery), then the manifest — the dated copy first, the live one last.
# Serving is a further, separate switch: `MAP_TERRAIN_MANIFEST` in
# packages/frontend/wrangler.toml.
#
# ## The sources' servers
#
# Every byte is read from the producers' own bulk endpoints (ICGC's
# datacloud, IGN's ATOM download service, USGS's AWS bucket, GSI's tile
# pyramid), never from a viewer, with retries and a User-Agent naming GoWay.
name: Build terrain tiles

on:
  workflow_dispatch:
    inputs:
      sets:
        description: >-
          Terrain sets (comma-separated ids from packages/frontend/scripts/terrain/catalogue.ts),
          e.g. "icgc-met-2021" or "usgs-3dep-s1m,gsi-dem5a"
        required: true
        default: icgc-met-2021
      box:
        description: Only cells meeting this lon/lat box (w,s,e,n), e.g. "-74.03,40.69,-73.90,40.88" for Manhattan; empty for the whole set
        required: false
        default: ''
      cells_per_job:
        description: Cells per job (a z7 cell is up to 64 blocks of 1–3 min each; a job may run 6 h)
        required: false
        default: '2'
      publish:
        description: Upload the archives to R2 and rewrite the manifest (off = a dry run that publishes nothing)
        type: boolean
        default: false
      keep_archives:
        description: Dry run only — keep the built archives as workflow artifacts for 3 days
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: goway-terrain-tiles
  cancel-in-progress: false

env:
  R2_BUCKET: goway-map-tiles
  MANIFEST_KEY: terrain/manifest.json
  OBJECT_PREFIXES: terrain
  MICROMAMBA_URL: https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.9.0-0.tar.bz2

jobs:
  plan:
    name: Plan the jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      stamp: ${{ steps.plan.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: plan
        env:
          SETS: ${{ inputs.sets }}
          BOX: ${{ inputs.box }}
          PER: ${{ inputs.cells_per_job }}
        run: |
          set -euo pipefail
          box=()
          [ -n "$BOX" ] && box=("--box=$BOX")
          bun packages/frontend/scripts/build-terrain-set.ts --plan --set="$SETS" \
            --cells-per-job="$PER" "${box[@]}" >> "$GITHUB_OUTPUT"
          # One stamp for the run; `r` + run number keeps CI's apart from
          # hand-built ones (the city run's lesson, city-r2.sh).
          echo "stamp=$(date -u +%Y%m%d)-r${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.batch.index }} (${{ matrix.batch.set }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Work on the large volume
        # ~14 GB free on /, ~70 GB on /mnt: a block's analysis grid is ~0.3 GB,
        # an IGN département up to ~10 GB extracted, a cell's archive ≤ ~120 MB.
        run: |
          sudo mkdir -p /mnt/terrain && sudo chown "$USER" /mnt/terrain
          df -h / /mnt
      - name: GDAL and PROJ's grids (pinned, conda-forge)
        run: |
          set -euo pipefail
          cd /mnt/terrain
          curl -fsSL --retry 5 "$MICROMAMBA_URL" | tar -xj bin/micromamba
          MAMBA_ROOT_PREFIX=/mnt/terrain/mamba ./bin/micromamba create -y -q -p /mnt/terrain/gdal \
            -f "$GITHUB_WORKSPACE/packages/frontend/scripts/terrain/environment.yml"
          /mnt/terrain/gdal/bin/gdalinfo --version

      - name: Build the cells
        env:
          SET: ${{ matrix.batch.set }}
          CELLS: ${{ matrix.batch.cells }}
          STAMP: ${{ needs.plan.outputs.stamp }}
          BOX: ${{ inputs.box }}
        run: |
          set -euo pipefail
          box=()
          [ -n "$BOX" ] && box=("--box=$BOX")
          bun run --cwd packages/frontend map:terrain-set --set="$SET" --stamp="$STAMP" \
            --cells="$CELLS" "${box[@]}" --out=/mnt/terrain/out --cache=/mnt/terrain/cache \
            --gdal=/mnt/terrain/gdal/bin
          rm -rf /mnt/terrain/out/.work
          # wrangler r2 object put stops at 300 MiB: a z7 cell is ~120 MB.
          big=$(find /mnt/terrain/out -name '*.pmtiles' -size +314572800c)
          if [ -n "$big" ]; then
            echo "::error::over wrangler's 300 MiB: $big"
            exit 1
          fi
          du -sh /mnt/terrain/out

      - name: Keep the archives (dry run, on request)
        if: ${{ inputs.keep_archives && !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: terrain-archives-${{ matrix.batch.index }}
          path: /mnt/terrain/out/terrain/
          retention-days: 3

      - name: Upload to R2 (publish only; dated keys, never overwritten, read back)
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty."
            exit 1
          fi
          if [ -d /mnt/terrain/out/terrain ]; then
            bash packages/frontend/scripts/city-r2.sh put-tree /mnt/terrain/out
          else
            echo "no cell of this batch had ground of the set; nothing to upload"
          fi

      # LAST: the manifest job reads these entries, and an entry must never
      # name an archive that did not reach R2.
      - name: Keep the entries and receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: terrain-entries-${{ matrix.batch.index }}
          path: |
            /mnt/terrain/out/entries/
            /mnt/terrain/out/**/*.receipt.json
          if-no-files-found: ignore
          retention-days: 30

  manifest:
    name: Manifest
    needs: [plan, build]
    # Also after a partly failed build: a failed job has no entry, so its
    # cells keep whatever the manifest named for them before.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: terrain-entries-*
          path: entries-download
          merge-multiple: true

      - name: The manifest now in R2 (publish only)
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Exit 3 is "none yet"; any other failure stops the run.
          status=0
          bash packages/frontend/scripts/city-r2.sh get-manifest "$PWD/previous.json" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi

      - name: Assemble
        env:
          STAMP: ${{ needs.plan.outputs.stamp }}
        run: |
          set -euo pipefail
          mkdir -p "$PWD/entries-download/entries"
          previous=""
          [ -f "$PWD/previous.json" ] && previous="--previous=$PWD/previous.json"
          bun run --cwd packages/frontend map:terrain-manifest \
            --entries="$PWD/entries-download/entries" $previous --out="$PWD/manifest.json"
          {
            echo "### Terrain manifest $STAMP"
            echo "Retired (still in R2; delete after the new manifest has been live a while):"
            sed 's/^/    /' "$PWD/manifest.json.retired.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: terrain-manifest
          path: |
            manifest.json
            manifest.json.retired.txt
          retention-days: 30

      - name: Publish the manifest (publish only; the dated copy first, then the live one)
        if: ${{ inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAMP: ${{ needs.plan.outputs.stamp }}
        run: |
          set -euo pipefail
          bash packages/frontend/scripts/city-r2.sh publish-manifest "$PWD/manifest.json" "$STAMP"
