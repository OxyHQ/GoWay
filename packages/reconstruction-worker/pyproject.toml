# GoWay Street 3D reconstruction worker.
#
# Python/CUDA is deliberate, not an inconsistency: the SfM/3DGS ecosystem
# (COLMAP, gsplat, PyTorch) is Python/CUDA-first, and forcing it into
# TypeScript for language uniformity would buy nothing. The worker stays under
# packages/* and is driven by the root `worker:*` scripts so the monorepo has
# one reproducible entry point per task.
#
# This package is INTERNAL. Its job contracts reach the rest of GoWay as
# shared contracts in packages/shared-types, never as a public SDK surface.
# Implementation lands in #12.

[project]
name = "goway-reconstruction-worker"
version = "0.1.0"
description = "GoWay Street 3D reconstruction worker — consumes AWS SQS jobs, produces versioned Gaussian scenes"
requires-python = ">=3.11"
# The Breathe License 1.0, the same licence as the rest of the repository.
# The text lives in the repository root LICENSE; this package is not
# published to PyPI, so it carries the reference rather than a copy.
license = { text = "LicenseRef-Breathe-1.0" }
dependencies = []

[project.scripts]
goway-worker = "goway_reconstruction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goway_reconstruction"]

[dependency-groups]
dev = []
