apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// @generated oxy-abi-splits: one APK per ABI, no universal APK (@oxy.so/app-preset
// withOxyAbiSplits). Edit the plugin, never this file. A release ships arm64-v8a and armeabi-v7a;
// a build that compiles none of them (-PreactNativeArchitectures=x86_64, as `expo run:android`
// passes for an emulator) splits to the ABIs it compiles, so that device still gets an APK.
def oxyBuiltAbis = (findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').toString().split(',').collect { it.trim() }.findAll { it }
def oxyReleaseAbis = ['arm64-v8a', 'armeabi-v7a'].findAll { oxyBuiltAbis.contains(it) }
def oxyApkAbis = oxyReleaseAbis ?: oxyBuiltAbis
// AGP refuses ABI splits in an invocation that also builds an app bundle while R8 shrinks
// resources (https://issuetracker.google.com/402800800), and a bundle never uses them: build
// the AAB and the APKs in two invocations.
def oxyBuildsBundle = gradle.startParameter.taskNames.any { it.tokenize(':').last().toLowerCase().startsWith('bundle') }

// @generated oxy-release-signing: the Oxy ecosystem release key (@oxy.so/services
// withOxyReleaseSigning). Edit the plugin, never this file.
def oxyHomePath = { String path -> path.startsWith('~/') ? System.getProperty('user.home') + path.substring(1) : path }
def oxySigningProblems = []
def oxySigningSecret = { String name ->
    def value = findProperty(name)
    if (value != null) return value.toString()
    def path = findProperty(name + '_FILE')
    if (path == null) return null
    def secretFile = file(oxyHomePath(path.toString()))
    if (!secretFile.isFile()) {
        oxySigningProblems << (name + '_FILE names ' + secretFile + ', which is not a file')
        return null
    }
    return secretFile.getText('UTF-8').trim()
}
def oxyStoreFilePath = findProperty('OXY_UPLOAD_STORE_FILE')
def oxyStoreFile = oxyStoreFilePath == null ? null : file(oxyHomePath(oxyStoreFilePath.toString()))
def oxyStorePassword = oxySigningSecret('OXY_UPLOAD_STORE_PASSWORD')
def oxyKeyAlias = findProperty('OXY_UPLOAD_KEY_ALIAS')?.toString()
def oxyKeyPassword = oxySigningSecret('OXY_UPLOAD_KEY_PASSWORD') ?: oxyStorePassword
if (oxyStoreFile == null) oxySigningProblems << 'OXY_UPLOAD_STORE_FILE is not set'
if (oxyStorePassword == null && findProperty('OXY_UPLOAD_STORE_PASSWORD_FILE') == null) oxySigningProblems << 'OXY_UPLOAD_STORE_PASSWORD (or OXY_UPLOAD_STORE_PASSWORD_FILE) is not set'
if (oxyKeyAlias == null) oxySigningProblems << 'OXY_UPLOAD_KEY_ALIAS is not set'
def oxyUploadSigning = oxyStoreFile != null && oxyStorePassword != null && oxyKeyAlias != null
// Opt-in: sign debug with the ecosystem key too (a dev client next to real Oxy apps),
// and then refuse a debug build without it exactly like a release.
def oxySignDebug = (findProperty('OXY_UPLOAD_SIGN_DEBUG') ?: 'false').toString().toBoolean()
def oxySignedBuildTypes = oxySignDebug ? ['release', 'debug'] : ['release']

android {
    // @generated oxy-abi-splits: the APKs are oxyApkAbis, one each; off while building a bundle.
    splits {
        abi {
            reset()
            enable !oxyBuildsBundle
            universalApk false
            include(*oxyApkAbis)
        }
    }

    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'to.goway.app.dev'
    defaultConfig {
        applicationId 'to.goway.app.dev'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2001
        versionName "0.2.1"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // @generated oxy-release-signing: the Oxy ecosystem key from the OXY_UPLOAD_* properties.
            // Without them it stays empty and oxyVerifyReleaseSigning fails the build.
            if (oxyUploadSigning) {
                storeFile oxyStoreFile
                storePassword oxyStorePassword
                keyAlias oxyKeyAlias
                keyPassword oxyKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig oxySignDebug ? signingConfigs.release : signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// @generated oxy-release-signing: every release build must carry the Oxy ecosystem certificate.
// Signed with anything else, the app declares so.oxy.permission.IDENTITY and
// DEVICE_SESSION under the wrong certificate: Android then refuses to install the
// correctly signed Oxy apps next to it (INSTALL_FAILED_DUPLICATE_PERMISSION), and
// Commons refuses it. This checks the release buildType's EFFECTIVE signing config.
def oxyVerifyReleaseSigning = tasks.register('oxyVerifyReleaseSigning') {
    group = 'verification'
    description = 'Fails unless release (and, with OXY_UPLOAD_SIGN_DEBUG, debug) is signed with the Oxy ecosystem certificate.'
    notCompatibleWithConfigurationCache('reads the android extension when it runs')
    doLast {
        def expected = 'b8ab3746466ce4569d7a6a0ffa1eed91bc375174d503613987ca09cb33d6a58d'
        def fail = { String reason ->
            throw new GradleException([
                'Oxy release signing: ' + reason,
                '',
                'Every Oxy Android release is signed with the ONE ecosystem key (certificate SHA-256 ' + expected + ').',
                'Provide it as Gradle properties, in ~/.gradle/gradle.properties, as -P<name>=<value>,',
                'or as ORG_GRADLE_PROJECT_<name> environment variables:',
                '  OXY_UPLOAD_STORE_FILE=~/.config/oxy/oxy-ecosystem-release.keystore',
                '  OXY_UPLOAD_STORE_PASSWORD_FILE=~/.config/oxy/oxy-ecosystem-release-keystore.pass (or OXY_UPLOAD_STORE_PASSWORD)',
                '  OXY_UPLOAD_KEY_ALIAS=oxy',
                '  OXY_UPLOAD_KEY_PASSWORD[_FILE] only when the key password differs from the store password',
                'Debug builds need none of this unless OXY_UPLOAD_SIGN_DEBUG=true.',
            ].join('\n'))
        }
        oxySignedBuildTypes.each { buildType ->
            def config = android.buildTypes.getByName(buildType).signingConfig
            if (config == null || config.storeFile == null) {
                fail('the ' + buildType + ' build has no keystore' + (oxySigningProblems ? ': ' + oxySigningProblems.join('; ') : '') + '.')
            }
            def keyStore = null
            try {
                keyStore = java.security.KeyStore.getInstance(config.storeFile, config.storePassword?.toCharArray())
            } catch (Exception e) {
                fail('could not open ' + config.storeFile + ' (' + e.getClass().getSimpleName() + ': ' + e.getMessage() + ').')
            }
            def certificate = keyStore.getCertificate(config.keyAlias)
            if (certificate == null) {
                fail(config.storeFile.toString() + ' has no certificate under the alias "' + config.keyAlias + '".')
            }
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.getEncoded()).encodeHex().toString()
            if (actual != expected) {
                fail('the ' + buildType + ' build is signed by "' + config.name + '" (' + config.storeFile + ', alias ' + config.keyAlias + '), certificate SHA-256 ' + actual + ', not the Oxy ecosystem one.')
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name ==~ (oxySignDebug ? /pre\w*(Release|Debug)Build|validateSigning\w*(Release|Debug)/ : /pre\w*ReleaseBuild|validateSigning\w*Release/)) {
        task.dependsOn(oxyVerifyReleaseSigning)
    }
}
