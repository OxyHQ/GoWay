# GoWay's web app is a Cloudflare WORKER serving static assets, not a Pages
# project.
#
# WHY NOT PAGES: a Pages project ALWAYS serves `<project>.pages.dev` and
# Cloudflare offers no way to switch it off — `wrangler pages project` has only
# `list`, `create` and `delete`. The fleet measured what that costs before
# migrating: `alia.onl` and `alia-app.pages.dev` served byte-identical
# deployments, and the second was in no CORS allowlist and no Oxy application's
# `redirectUris`, so it rendered the shell and failed every call it made — an
# indexable, signed-out copy of the app that looks alive and is not. GoWay
# would inherit exactly that the moment its API goes live: the backend admits
# an explicit list of origins (`CORS_APP_ORIGINS`, parsed in
# `packages/backend/src/config`), and the Oxy application behind
# `EXPO_PUBLIC_OXY_CLIENT_ID` carries an explicit `redirectUris` list — a
# `goway.pages.dev` would be in neither, so it would boot and then fail every
# call and every sign-in. `workers_dev = false` below is what closes it, and it
# is the whole reason this file is a Worker config rather than a `pages deploy`
# flag.
name = "goway"
compatibility_date = "2026-09-09"
main = "./worker/index.js"

# There IS a `main` now, and the argument that used to be here against one was
# right and is preserved, because it still governs every path the Worker does
# not claim: GoWay's web build is public by design (the map, search, place
# details and routing all work signed out), so there is nothing for a script to
# gate, and "a script that exists only to forward to `env.ASSETS` is a runtime
# failure mode bought for nothing".
#
# What changed is that GoWay acquired a path that CANNOT be a static asset.
# Every map resource now comes from `goway.to` rather than from
# `tiles.openfreemap.org` — the style documents, the glyph ranges and the
# sprite are generated here and committed, so they are assets like any other.
# The TILES are not: the planet is gigabytes, GoWay is deliberately not storing
# it, and the remaining shape is a proxy with edge caching. A proxy is code.
#
# `run_worker_first` below is what keeps the old argument true anyway. It names
# six map prefixes; every other request is answered by the asset pipeline
# without this Worker executing a line, so the failure mode the old comment
# warned about is bought only for `/map/tiles/*`, `/map/fonts/*`,
# `/map/terrain/*`, `/map/contours/*`, `/map/city/*` and `/map/city-roads/*`,
# not for the app. The `env.ASSETS.fetch` at the bottom of `worker/index.js` is a safety
# net for a misconfiguration here, not the normal path.
#
# Consequence worth knowing before someone goes looking: the SPA fallback below
# can answer a *stale hashed asset* URL with `index.html`, which is why Mention
# and Clarity carry a `worker/index.js` of their own. The exposure here is one
# already-open tab across a deploy, because Workers Assets serves HTML with
# `must-revalidate` and every asset URL in a freshly-fetched `index.html` is
# current. That is still not what this Worker is for, and widening
# `run_worker_first` to fix it is a separate decision with a much larger blast
# radius.
#
# `GET /accounts/{a}/workers/scripts/goway` answers 204 for a Worker in this
# shape — neither 200 nor 404. Any existence check written against this
# deployment must read `/workers/services/goway`, which is 200/404 for both
# shapes; the scripts endpoint will report a Worker that plainly exists as
# neither present nor absent.
workers_dev = false

# Stated rather than left to the default, because the default is not a
# constant: Cloudflare's rule is `preview_urls = workers_dev`, so this line
# currently changes nothing and keeps changing nothing if that rule moves. A
# preview URL is a second hostname, which is the defect this file exists to
# remove.
preview_urls = false

# `app.config.js` sets `web.output: 'single'`, so `expo export --platform web`
# emits ONE `index.html` plus content-hashed assets — a client-routed SPA, not
# per-route static HTML. Every expo-router route (`/place/<id>`, `/search`, a
# shared deep link) exists only in the bundle, so any of them arriving as a
# cold request must be answered with `index.html`. That is what
# `not_found_handling` does here; without it a shared place link is a 404.
#
# `public/_headers` is carried into `dist/` verbatim by the export — verified
# on this tree, `dist/_headers` is present after `bun run --cwd
# packages/frontend export:web` — and it is what re-adds the two response
# headers Cloudflare Pages used to inject for free and Workers Static Assets
# does not (`x-content-type-options`, `referrer-policy`). Read that file before
# changing anything about caching here.
#
# `public/vendor/maplibre-gl/<version>/` is generated into the export by
# `scripts/vendor-maplibre-worker.js` on every Metro run and travels the same
# way; it is gitignored on purpose, so it exists in CI only because the export
# step regenerates it.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# `binding` is what makes `env.ASSETS` exist. Without it the Worker's fallback
# path — and the glyph handler's "static first, upstream second" — throw on an
# undefined property, which is a 500 on every request the Worker touches.
binding = "ASSETS"

# The Worker runs BEFORE the asset lookup for these prefixes only.
#
# `/map/tiles/*` has no asset to find; the Worker is the only thing that can
# answer it. `/map/fonts/*` DOES have assets — the Inter ranges GoWay
# generates — and the Worker runs first anyway so it can fall back to the
# upstream Noto ranges for the scripts Inter does not cover (CJK, Arabic,
# Devanagari, Thai, reached whenever a feature has a `name` but no
# `name:latin`). It asks `env.ASSETS` first and only proxies on a miss, so the
# committed ranges are still served by the asset pipeline.
#
# Detecting that miss is subtler than it looks, and `worker/index.js` says so
# at length: with `not_found_handling = "single-page-application"`,
# `env.ASSETS.fetch()` answers a path it does not have with 200 and
# `index.html`, not with a 404. Anything here that changes the fallback must be
# read together with that function.
#
# Everything else — the app shell, the JS chunks, the style documents, the
# sprite — is untouched by the Worker and keeps being served exactly as before.
#
# `/map/terrain/*` is the relief prototype's elevation tiles
# (`docs/MAP_TERRAIN_GLOBE.md`): no asset, like the vector tiles. Nothing
# requests it while the globe/terrain flags are off, which is everywhere in
# production today.
#
# `/map/city/*` and `/map/city-roads/*` are GoWay's 3D city tiles and their
# road graph (`worker/city.js`, `docs/MAP_CITY_PLANET.md`): no asset either.
# Listed so that the SPA fallback never answers a tile path with
# `index.html` (a 200 the client would try to decode). With
# `MAP_CITY_MANIFEST` below unset the Worker answers every one of them 404
# and the coverage document covers nothing.
#
# `/map/satellite/*` is GoWay's satellite imagery (`worker/satellite.js`,
# `docs/MAP_SATELLITE.md`): tiles, the coverage document, the manifest and its
# receipts. No asset either; with `MAP_SATELLITE_MANIFEST` below unset every
# tile is 404 and the coverage document lists no sets. The satellite and
# hybrid STYLE documents are assets the Worker reads and returns with each
# imagery tier bounded by the live manifest, so MapLibre asks only for tiles
# that can exist.
run_worker_first = [
  "/map/tiles/*",
  "/map/fonts/*",
  "/map/terrain/*",
  "/map/contours/*",
  "/map/city/*",
  "/map/city-roads/*",
  "/map/satellite/*",
  "/map/styles/satellite/*",
  "/map/styles/hybrid/*",
]

# GoWay's OWN tiles: one PMTiles archive in R2, read by byte range.
#
# `worker/index.js` serves `/map/tiles/{z}/{x}/{y}.pbf` out of this bucket, and
# `scripts/build-map-tiles.ts` is what puts an archive in it. There is no tile
# server: R2 hands back byte ranges and PMTiles is the format that makes a
# planet addressable that way. R2 charges nothing for egress, which for a map
# is the entire cost — the same planet on S3 would bill $0.09 per GB out.
#
# `MAP_TILE_ARCHIVE` is a VERSIONED key and a new build always gets a new one.
# A PMTiles archive is addressed by byte offset, so overwriting the object a
# Worker is mid-request against does not serve a stale tile — it serves
# whatever now lives at that offset, which is a directory decoded as a tile or
# a tile from somewhere else on Earth. Upload, point this at the new key,
# deploy, then delete the old object. That sequence is also the rollback.
#
# ## These are live as of 2026-09-21
#
# The setup they waited for is done: R2 is enabled on the account, the bucket
# exists, and `planet/20260921.pmtiles` is in it — 84.2 GB, zoom 0-14, built
# from the 2026-09-13 planet with the pinned Planetiler and verified before
# upload (16 layers matching `lib/map/style/schema.ts`, and 7002 of 7002
# sampled `poi` features carrying their OSM element id, which is the property
# the whole exercise was for).
#
# `MAP_TILE_UPSTREAM` below is now dead weight on the happy path: the Worker
# reaches it only if this binding or the key goes missing. It stays for one
# more cycle as the rollback, and step 5 remains:
#
#   Once this has been live long enough to trust, delete `MAP_TILE_UPSTREAM`
#   below, the fallback in `worker/index.js`, and `OPENFREEMAP_ENDPOINTS` from
#   `lib/map/provider.ts` — in the same commit, because each of them exists
#   only for the others.
#
# To publish a NEW planet: upload under a new dated key, change the one line
# below, deploy, then delete the old object. Never overwrite the object this
# points at — a PMTiles archive is addressed by byte offset, so a Worker
# mid-request would read a directory as a tile.
#
[[r2_buckets]]
binding = "MAP_TILES"
bucket_name = "goway-map-tiles"

# The FALLBACK upstream, as deployment configuration rather than as a hostname
# written into product code. `lib/map/provider.ts` → `OPENFREEMAP_ENDPOINTS` is
# the one module in the repository that names a map vendor, and these two
# values must equal the ones recorded there. They are duplicated rather than
# imported because a Worker bundle and an Expo bundle share no build step.
#
# `MAP_TILE_UPSTREAM` is reached ONLY while the R2 binding above is commented
# out. `MAP_GLYPH_UPSTREAM` is a different matter and is not going anywhere
# yet: GoWay generates its own Inter ranges, but Inter is Latin, Greek and
# Cyrillic, and a Tokyo label with no `name:latin` still falls through to the
# upstream Noto ranges. Removing it would remove the label, not the dependency.
#
# `MAP_TILE_UPSTREAM` is the TileJSON *document*, not a `{z}/{x}/{y}` template:
# it names the current date-stamped planet build, old builds are deleted, and
# resolving it at request time (cached for an hour) is what stops a deployment
# serving 404s from the day the next planet lands.
#
# `MAP_TERRAIN_UPSTREAM` is the relief prototype's elevation tiles, proxied so
# that no viewer's browser talks to Mapterhorn (whose endpoint logs callers'
# IPs and publishes no usage policy). It must equal `MAPTERHORN_ENDPOINTS.tiles`
# in `lib/map/provider.ts`. Setting `MAP_TERRAIN_ARCHIVE` to the key of
# Mapterhorn's `planet.pmtiles` uploaded into `MAP_TILES` (z0–12, 356 GB,
# ~$5.3/month on R2) serves them from GoWay's own bucket instead — the
# production path; see `docs/MAP_TERRAIN_GLOBE.md` → "The DEM".
[vars]
MAP_TILE_ARCHIVE = "planet/20260921.pmtiles"
MAP_TILE_UPSTREAM = "https://tiles.openfreemap.org/planet"
MAP_GLYPH_UPSTREAM = "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf"
MAP_TERRAIN_UPSTREAM = "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp"

# The city tiles' MANIFEST: its object key in `MAP_TILES`. The manifest names
# one dated archive per region (buildings and roads) and which tiles each
# owns (`worker/city.js`, `docs/MAP_CITY_PLANET.md`). Written after the
# archives it names are uploaded — by `.github/workflows/build-city-tiles.yml`,
# or by hand for the first regions (Catalonia, Madrid and New York State,
# stamp 20261012-1, with the Catastro and NYC 3D model merged).
#
# ON since 2026-10-12, on the owner's approval. Every manifest ever published
# is also kept as `city/manifests/<stamp>.json`. Rollback: copy a previous one
# over `city/manifest.json` (live within ~6 minutes, no deploy), or comment
# this line out and deploy (every city tile 404, coverage empty: the map draws
# the basemap's buildings, as before).
MAP_CITY_MANIFEST = "city/manifest.json"

# The satellite imagery's MANIFEST: its key in `MAP_TILES`. It names, per
# imagery set, the dated stamp and the cells published (one archive per cell,
# `satellite/<set>/<stamp>/<z>/<x>/<y>.pmtiles` + receipt), written by
# `.github/workflows/build-satellite-tiles.yml` after the archives it names
# (`docs/MAP_SATELLITE.md`). OFF until the owner approves a published run:
# unset, every `/map/satellite/` tile is 404 and nothing touches storage.
# MAP_SATELLITE_MANIFEST = "satellite/manifest.json"

# The only name this deployment answers to, and the reason `workers_dev` is
# off. `goway.to` is the zone apex: Cloudflare writes and manages the record
# for a custom domain itself, which is why the apex must carry NO pre-existing
# address record when this first deploys — a Worker custom domain refuses a
# hostname that already has externally managed DNS records (`code: 100117`).
# Order is DNS → deploy, never the reverse; README.md → "Deploying the web app"
# has the one-time steps.
[[routes]]
pattern = "goway.to"
custom_domain = true
